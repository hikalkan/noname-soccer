<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Noname Soccer</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40890144,"index.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	const COI_RELOAD_KEY = 'godot-coi-reload';
	const COI_MAX_ATTEMPTS = 3;

	function coiAttempts() {
		try {
			return parseInt(sessionStorage.getItem(COI_RELOAD_KEY) || '0', 10) || 0;
		} catch (err) {
			return 0;
		}
	}

	function bumpCoiAttempt() {
		const n = coiAttempts() + 1;
		try {
			sessionStorage.setItem(COI_RELOAD_KEY, String(n));
		} catch (err) {
			// ignore
		}
		return n;
	}

	function clearCoiAttempts() {
		try {
			sessionStorage.removeItem(COI_RELOAD_KEY);
		} catch (err) {
			// ignore
		}
	}

	function reloadForCrossOriginIsolation() {
		const n = bumpCoiAttempt();
		if (n > COI_MAX_ATTEMPTS) {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
			return;
		}
		window.location.reload();
	}

	function waitForServiceWorkerControl(timeoutMs) {
		if (navigator.serviceWorker.controller) {
			return Promise.resolve(true);
		}
		return new Promise((resolve) => {
			let done = false;
			const finish = (ok) => {
				if (done) {
					return;
				}
				done = true;
				navigator.serviceWorker.removeEventListener('controllerchange', onChange);
				resolve(ok);
			};
			const onChange = () => finish(true);
			navigator.serviceWorker.addEventListener('controllerchange', onChange);
			setTimeout(() => finish(!!navigator.serviceWorker.controller), timeoutMs);
		});
	}

	async function ensureThreadedServiceWorker() {
		const swUrl = GODOT_CONFIG['serviceWorker'];
		if (!swUrl || !('serviceWorker' in navigator)) {
			return false;
		}
		// Register (or re-register) so the play/ worker is active; do not race a short timeout.
		const registration = await navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' });
		const worker = registration.active || registration.waiting || registration.installing;
		if (worker) {
			try {
				worker.postMessage('claim');
			} catch (err) {
				// ignore
			}
		}
		await navigator.serviceWorker.ready;
		if (!navigator.serviceWorker.controller) {
			await waitForServiceWorkerControl(4000);
		}
		return !!navigator.serviceWorker.controller;
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			ensureThreadedServiceWorker().then((controlling) => {
				if (!controlling && coiAttempts() >= COI_MAX_ATTEMPTS) {
					const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
					displayFailureNotice(missingMsg + missing.join('\n'));
					return;
				}
				reloadForCrossOriginIsolation();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
				reloadForCrossOriginIsolation();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		clearCoiAttempts();
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
