<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Noname Soccer</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0a1221;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-notice p {
	margin: 0.6rem 0 0;
}

#status-notice .notice-actions {
	display: flex;
	flex-wrap: wrap;
	gap: 0.75rem;
	justify-content: center;
	margin-top: 1rem;
}

#status-notice button, #status-notice .notice-actions a {
	background-color: #e0e0e0;
	border: 0;
	border-radius: 0.4rem;
	color: #2a1a20;
	cursor: pointer;
	font: inherit;
	font-weight: bold;
	padding: 0.6rem 1.4rem;
	text-decoration: none;
}

#status-notice .notice-actions a {
	background-color: transparent;
	border: 1px solid #e0e0e0;
	color: #e0e0e0;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":88727076,"index.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// A refresh that really loads a new build. The service worker keeps serving the cached game
	// until its waiting successor is activated, and the game would swallow F5 / Ctrl+R anyway, so
	// both keys (and the game's Update buttons) come here: activate a waiting worker (it reloads
	// every tab), otherwise reload.
	window.nonameUpdate = async function () {
		const reload = () => window.location.reload();
		if (!('serviceWorker' in navigator)) {
			reload();
			return;
		}
		try {
			const reg = await navigator.serviceWorker.getRegistration();
			if (!reg) {
				reload();
				return;
			}
			if (!reg.waiting) {
				await withTimeout(reg.update(), 4000);
			}
			const worker = reg.waiting || reg.installing;
			if (!worker) {
				reload();
				return;
			}
			const go = () => (reg.waiting ? reg.waiting.postMessage('update') : reload());
			if (worker.state === 'installed') {
				go();
				return;
			}
			worker.addEventListener('statechange', () => {
				if (worker.state !== 'installing') {
					go();
				}
			});
			setTimeout(reload, 8000);
		} catch (err) {
			reload();
		}
	};
	window.addEventListener('keydown', (e) => {
		const key = (e.key || '').toLowerCase();
		if (key === 'f5' || ((e.ctrlKey || e.metaKey) && key === 'r')) {
			e.preventDefault();
			e.stopImmediatePropagation();
			window.nonameUpdate();
		}
	}, true);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	// The threaded build needs cross-origin isolation, which on GitHub Pages only the PWA service
	// worker can add (COOP/COEP on its responses). A page loaded before the worker controls it is
	// not isolated and has to reload once the worker is active.
	const COI_STATE_KEY = 'godot-coi-reload';
	const COI_MAX_ATTEMPTS = 4;
	const COI_RELOAD_DELAYS_MS = [0, 500, 1500, 3000];
	const COI_READY_TIMEOUT_MS = 20000;
	const COI_CONTROL_TIMEOUT_MS = 5000;

	const COI_TEXT = {
		en: {
			title: 'The game could not start in this browser tab.',
			body: 'The browser did not enable a feature the game needs. Reloading the page usually fixes it.',
			hint: 'If it keeps failing, open the page in Chrome, Edge, Firefox or Safari (not inside another app), or download the desktop version.',
			reload: 'Reload',
			download: 'Desktop version',
		},
		tr: {
			title: 'Oyun bu sekmede başlatılamadı.',
			body: 'Tarayıcı, oyunun ihtiyaç duyduğu bir özelliği açmadı. Sayfayı yenilemek genelde sorunu çözer.',
			hint: 'Sorun sürerse sayfayı Chrome, Edge, Firefox veya Safari\'de açın (başka bir uygulamanın içinden değil) ya da masaüstü sürümünü indirin.',
			reload: 'Yenile',
			download: 'Masaüstü sürümü',
		},
	};

	function coiLang() {
		try {
			const saved = localStorage.getItem('noname-soccer-lang');
			if (saved === 'tr' || saved === 'en') {
				return saved;
			}
		} catch (err) {
			// ignore
		}
		return (navigator.language || 'en').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
	}

	function readCoiState() {
		try {
			const state = JSON.parse(sessionStorage.getItem(COI_STATE_KEY) || 'null');
			if (state && typeof state.n === 'number') {
				return state;
			}
		} catch (err) {
			// ignore
		}
		return { n: 0, auto: false };
	}

	function writeCoiState(state) {
		try {
			sessionStorage.setItem(COI_STATE_KEY, JSON.stringify(state));
		} catch (err) {
			// ignore
		}
	}

	function clearCoiState() {
		try {
			sessionStorage.removeItem(COI_STATE_KEY);
		} catch (err) {
			// ignore
		}
	}

	// Only reloads made by this script count toward the limit; a manual refresh or a new visit
	// starts a fresh round, so the user is never stuck behind attempts from earlier.
	const coiState = readCoiState();
	const coiAttempts = coiState.auto ? coiState.n : 0;
	writeCoiState({ n: coiAttempts, auto: false });

	function displayIsolationNotice() {
		console.error('Missing features:', missing);
		const text = COI_TEXT[coiLang()];
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const title = document.createElement('strong');
		title.textContent = text.title;
		statusNotice.appendChild(title);
		[text.body, text.hint].forEach((line) => {
			const p = document.createElement('p');
			p.textContent = line;
			statusNotice.appendChild(p);
		});
		const actions = document.createElement('div');
		actions.className = 'notice-actions';
		const reload = document.createElement('button');
		reload.type = 'button';
		reload.textContent = text.reload;
		reload.addEventListener('click', () => {
			clearCoiState();
			window.location.reload();
		});
		actions.appendChild(reload);
		const download = document.createElement('a');
		download.href = '../#download';
		download.textContent = text.download;
		actions.appendChild(download);
		statusNotice.appendChild(actions);
		setStatusMode('notice');
		initializing = false;
	}

	function reloadForCrossOriginIsolation() {
		if (coiAttempts >= COI_MAX_ATTEMPTS) {
			displayIsolationNotice();
			return;
		}
		writeCoiState({ n: coiAttempts + 1, auto: true });
		const delay = COI_RELOAD_DELAYS_MS[Math.min(coiAttempts, COI_RELOAD_DELAYS_MS.length - 1)];
		setTimeout(() => window.location.reload(), delay);
	}

	function withTimeout(promise, timeoutMs) {
		return Promise.race([
			promise,
			new Promise((resolve) => setTimeout(() => resolve(null), timeoutMs)),
		]);
	}

	function waitForServiceWorkerControl(timeoutMs) {
		if (navigator.serviceWorker.controller) {
			return Promise.resolve(true);
		}
		return new Promise((resolve) => {
			let done = false;
			const finish = (ok) => {
				if (done) {
					return;
				}
				done = true;
				navigator.serviceWorker.removeEventListener('controllerchange', onChange);
				resolve(ok);
			};
			const onChange = () => finish(true);
			navigator.serviceWorker.addEventListener('controllerchange', onChange);
			setTimeout(() => finish(!!navigator.serviceWorker.controller), timeoutMs);
		});
	}

	async function ensureServiceWorkerControl() {
		const registration = await navigator.serviceWorker.register(GODOT_CONFIG['serviceWorker'], { updateViaCache: 'none' });
		// clients.claim() only works from an activated worker, so ask the active one, not an installing one.
		let active = registration.active;
		if (!active) {
			const ready = await withTimeout(navigator.serviceWorker.ready, COI_READY_TIMEOUT_MS);
			active = ready ? ready.active : null;
		}
		if (!active) {
			return false;
		}
		if (!navigator.serviceWorker.controller) {
			active.postMessage('claim');
			await waitForServiceWorkerControl(COI_CONTROL_TIMEOUT_MS);
		}
		return !!navigator.serviceWorker.controller;
	}

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator && window.isSecureContext) {
			ensureServiceWorkerControl().catch((err) => {
				console.error('Error while registering service worker:', err);
				return false;
			}).then(() => reloadForCrossOriginIsolation());
		} else {
			displayIsolationNotice();
		}
	} else {
		clearCoiState();
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
