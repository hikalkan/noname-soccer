<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Privacy Policy — Noname Soccer</title>
	<meta name="description" content="How the Noname Soccer website and game handle your data: Google Analytics on the site, no data collection in the game, and what an online match sends.">
	<link rel="canonical" href="https://nonamesoccer.com/privacy.html">
	<link rel="alternate" hreflang="en" href="https://nonamesoccer.com/en/privacy/">
	<link rel="alternate" hreflang="tr" href="https://nonamesoccer.com/tr/privacy/">
	<link rel="alternate" hreflang="es" href="https://nonamesoccer.com/es/privacy/">
	<link rel="alternate" hreflang="pt-BR" href="https://nonamesoccer.com/pt-BR/privacy/">
	<link rel="alternate" hreflang="de" href="https://nonamesoccer.com/de/privacy/">
	<link rel="alternate" hreflang="fr" href="https://nonamesoccer.com/fr/privacy/">
	<link rel="alternate" hreflang="it" href="https://nonamesoccer.com/it/privacy/">
	<link rel="alternate" hreflang="x-default" href="https://nonamesoccer.com/privacy.html">
	<script>
	(function () {
		var langs = ["en", "tr", "es", "pt-BR", "de", "fr", "it"], key = "noname-soccer-lang", tail = "privacy/", lang = "";
		function pick(v) {
			// "pt", "pt-PT", "pt_br" all get pt-BR; "de-AT" gets de.
			v = String(v || "").replace("_", "-").toLowerCase();
			for (var i = 0; i < langs.length; i++) if (langs[i].toLowerCase() === v) return langs[i];
			v = v.split("-")[0];
			if (v === "pt") return "pt-BR";
			return langs.indexOf(v) >= 0 ? v : "";
		}
		var params = null;
		try { params = new URLSearchParams(location.search); lang = pick(params.get("lang")); params.delete("lang"); } catch (e) { /* ignore */ }
		if (!lang) { try { lang = pick(localStorage.getItem(key)); } catch (e) { /* ignore */ } }
		var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
		for (var i = 0; !lang && i < prefs.length; i++) lang = pick(prefs[i]);
		var query = params && params.toString() ? "?" + params.toString() : "";
		location.replace("/" + (lang || "en") + "/" + tail + query + location.hash);
	}());
	</script>
	<noscript><meta http-equiv="refresh" content="0; url=/en/privacy/"></noscript>
	<meta name="theme-color" content="#0b1628">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/landing.css">
</head>
<body>
	<main class="legal">
		<div class="wrap">
			<h1>Noname Soccer</h1>
			<ul class="lang-pick">
				<li><a href="/en/privacy/" hreflang="en" lang="en">English</a></li>
				<li><a href="/tr/privacy/" hreflang="tr" lang="tr">Türkçe</a></li>
				<li><a href="/es/privacy/" hreflang="es" lang="es">Español</a></li>
				<li><a href="/pt-BR/privacy/" hreflang="pt-BR" lang="pt-BR">Português (Brasil)</a></li>
				<li><a href="/de/privacy/" hreflang="de" lang="de">Deutsch</a></li>
				<li><a href="/fr/privacy/" hreflang="fr" lang="fr">Français</a></li>
				<li><a href="/it/privacy/" hreflang="it" lang="it">Italiano</a></li>
			</ul>
		</div>
	</main>
</body>
</html>
