<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Noname Soccer — Free arcade football game</title>
	<meta name="description" content="Free arcade 11v11 soccer. Play against the CPU, with a friend on one computer or online. In the browser or on Windows and macOS, no account needed.">
	<link rel="canonical" href="https://nonamesoccer.com/">
	<link rel="alternate" hreflang="en" href="https://nonamesoccer.com/en/">
	<link rel="alternate" hreflang="tr" href="https://nonamesoccer.com/tr/">
	<link rel="alternate" hreflang="x-default" href="https://nonamesoccer.com/">
	<script>
	(function () {
		var langs = ["en", "tr"], key = "noname-soccer-lang", tail = "", lang = "";
		function pick(v) {
			v = String(v || "").toLowerCase().split("-")[0];
			return langs.indexOf(v) >= 0 ? v : "";
		}
		var params = null;
		try { params = new URLSearchParams(location.search); lang = pick(params.get("lang")); params.delete("lang"); } catch (e) { /* ignore */ }
		if (!lang) { try { lang = pick(localStorage.getItem(key)); } catch (e) { /* ignore */ } }
		var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
		for (var i = 0; !lang && i < prefs.length; i++) lang = pick(prefs[i]);
		var query = params && params.toString() ? "?" + params.toString() : "";
		location.replace("/" + (lang || "en") + "/" + tail + query + location.hash);
	}());
	</script>
	<noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
	<meta name="theme-color" content="#0b1628">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/landing.css">
</head>
<body>
	<main class="legal">
		<div class="wrap">
			<h1>Noname Soccer</h1>
			<ul class="lang-pick">
				<li><a href="/en/" hreflang="en" lang="en">English</a></li>
				<li><a href="/tr/" hreflang="tr" lang="tr">Türkçe</a></li>
			</ul>
		</div>
	</main>
</body>
</html>
